name: Schedule window

on:
  schedule:
    - cron: '5 6 * * *'
      timezone: 'Pacific/Auckland'
  workflow_dispatch:

permissions:
  actions: write

env:
  WINDOW_WORKFLOW: league-start.yml
  OFF_WINDOW_WORKFLOW: normal.yml
  WINDOW_START: '2026-07-25'
  WINDOW_END: '2026-07-28'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Enable whichever workflow suits today, disable the other
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%F)

          # ISO-8601 dates compare correctly as plain strings, so no date maths
          if [[ "$today" > "$WINDOW_END" ]]; then
            # outside of league start
            echo "$today is after $WINDOW_END disabling league start workflow"
            gh workflow disable league-start.yml -R "$GITHUB_REPOSITORY" || true
            echo "done"
          else
            echo "nothing to do"
          fi
